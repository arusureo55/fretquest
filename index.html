<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FretQuest</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12141C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FretQuest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F7F7FA;--surface:#FFFFFF;--surface2:#ECEDF3;--text:#1A1C24;--sub:#5A5F73;--accent:#D98A00;--line:rgba(26,28,36,.13);
  --perfect:#3DD9EB;--great:#4CD07D;--good:#F5D23B;--miss:#8A8FA3;
  --s1:#E8697D;--s2:#F29E4C;--s3:#E6D15A;--s4:#6CC4A1;--s5:#5B9BE6;--s6:#A77BE0;
  --fs:1;color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#12141C;--surface:#1E2130;--surface2:#282C3E;--text:#F2F2F5;--sub:#A0A4B8;--accent:#FFB020;--line:rgba(242,242,245,.12);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#12141C;--surface:#1E2130;--surface2:#282C3E;--text:#F2F2F5;--sub:#A0A4B8;--accent:#FFB020;--line:rgba(242,242,245,.12);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;font-size:calc(16px * var(--fs));scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;font-size:1rem;line-height:1.65;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,select,input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.sub{color:var(--sub)}
.small{font-size:.875rem}
h1{font-size:1.375rem;line-height:1.35;margin:0 0 4px;font-weight:900;letter-spacing:.01em}
h2{font-size:1.125rem;line-height:1.4;margin:0 0 8px;font-weight:700}
p{margin:0 0 12px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100%}
main{padding:12px 16px 104px}
.top{display:flex;align-items:center;gap:8px;padding:8px 0 12px}
.top .grow{flex:1;min-width:0}
.logo{font-weight:900;font-size:1.25rem;letter-spacing:.02em;display:flex;flex-direction:column;gap:5px}
.strings{display:flex;flex-direction:column;gap:2px;width:96px}
.strings i{display:block;height:2px;border-radius:2px}
.iconbtn{width:48px;height:48px;border-radius:14px;border:0;background:transparent;display:inline-grid;place-items:center;cursor:pointer;color:var(--text)}
.iconbtn:hover{background:var(--surface2)}
.iconbtn svg{width:24px;height:24px}
.btn{min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:1.0625rem;font-weight:700;padding:10px 20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--text)}
.btn.primary{background:var(--accent);border-color:transparent;color:#1A1C24}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:20px;height:20px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:12px;padding:16px;border:1px solid var(--line)}
.card.flat{border:0}
.section{margin:24px 0 8px;font-weight:700;font-size:1.0625rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:8px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);font-weight:700}
.bar{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px}
.star-on{color:var(--accent)}
.star-off{color:var(--sub);opacity:.5}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;background:var(--surface2);font-size:.8125rem;font-weight:500}
.banner{border-radius:12px;padding:12px 16px;background:var(--surface2);display:flex;gap:12px;align-items:flex-start}
.banner>svg{width:24px;height:24px;flex:none}
.ob .banner>svg{width:40px;height:40px}
.banner b{display:block}
.empty{text-align:center;padding:40px 16px}
.empty svg{width:48px;height:48px;color:var(--sub)}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border-top:1px solid var(--line);z-index:20}
nav.tabs .in{display:flex;max-width:560px;margin:0 auto}
nav.tabs button{flex:1;min-height:60px;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.75rem;color:var(--sub);font-weight:500}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--text);font-weight:700}
nav.tabs button[aria-current="page"] svg{color:var(--accent)}
/* home */
.hero{border-radius:12px;padding:16px;background:var(--surface);border:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.lvl{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--surface2) 0);position:relative}
.lvl::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--surface)}
.lvl span{position:relative;z-index:1;text-align:center;line-height:1.1;font-weight:900;font-size:1.25rem}
.lvl small{display:block;font-size:.6875rem;font-weight:500;color:var(--sub)}
.quest{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.quest:first-of-type{border-top:0}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.check.on{background:var(--great);border-color:var(--great);color:#12141C}
.check svg{width:16px;height:16px}
/* map */
.worldtabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.worldtabs::-webkit-scrollbar{display:none}
.worldtabs .chip{flex:none;white-space:nowrap}
.wbanner{margin-top:12px;border-radius:12px;padding:20px 16px;color:#F2F2F5;position:relative;overflow:hidden}
.wbanner h1{color:#fff}
.wbanner p{margin:0;color:rgba(242,242,245,.85)}
.wbanner .lines{position:absolute;right:-10px;top:14px;display:flex;flex-direction:column;gap:7px;width:45%;opacity:.55}
.wbanner .lines i{display:block;height:2px;border-radius:2px}
.path{position:relative;margin-top:16px}
.path svg.route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;cursor:pointer;padding:0;width:96px}
.node .disc{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);font-weight:900;font-size:1.125rem}
.node.boss .disc{width:78px;height:78px;font-size:.9375rem;border-width:3px}
.node.cur .disc{border-color:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 25%,transparent)}
.node.done .disc{background:var(--surface2)}
.node.locked .disc{opacity:.5}
.node .disc svg{width:22px;height:22px}
.node .stars{font-size:.875rem;letter-spacing:1px;line-height:1}
.node .lbl{font-size:.75rem;color:var(--sub);text-align:center;line-height:1.25;max-width:96px}
.node.review .disc{border-style:dashed}
/* detail */
.diagrams{display:flex;gap:12px;flex-wrap:wrap}
.diagram{display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700}
label.chk{display:flex;gap:12px;align-items:center;min-height:48px;cursor:pointer}
label.chk input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.speed{display:flex;align-items:center;gap:12px}
.speed input[type=range]{flex:1;accent-color:var(--accent);height:32px}
/* result */
.bigstars{font-size:3rem;line-height:1;letter-spacing:6px;text-align:center}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade{border-radius:12px;padding:10px 4px;text-align:center;background:var(--surface2)}
.grade b{display:block;font-size:1.25rem}
.grade .sym{font-size:1.1rem}
.hist{display:flex;align-items:flex-end;gap:2px;height:64px}
.hist i{flex:1;background:var(--sub);opacity:.5;border-radius:2px 2px 0 0;min-height:2px}
.hist i.mid{background:var(--great);opacity:1}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
/* weak */
.dots{display:inline-flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.dots i.on{background:var(--great);border-color:var(--great)}
/* league */
.lrow{display:grid;grid-template-columns:32px 1fr auto;gap:8px;align-items:center;padding:10px 12px;border-radius:12px}
.lrow.me{background:var(--surface2);font-weight:700}
.lline{font-size:.75rem;color:var(--sub);display:flex;align-items:center;gap:8px;margin:4px 0}
.lline::before,.lline::after{content:"";flex:1;height:1px;background:var(--line)}
/* mypage */
.week{display:flex;align-items:flex-end;gap:8px;height:110px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.week i{display:block;width:100%;border-radius:6px 6px 0 0;background:var(--accent);min-height:3px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{border-radius:12px;padding:12px 6px;text-align:center;background:var(--surface2);font-size:.8125rem;line-height:1.35}
.badge .b{font-size:1.5rem;display:block;font-weight:900}
.badge.off{opacity:.45}
/* tools */
.tuner{text-align:center}
.tuner .note{font-size:4.5rem;font-weight:900;line-height:1}
.meter{position:relative;height:48px;margin:16px 8px}
.meter .scale{position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line)}
.meter .center{position:absolute;left:50%;top:6px;bottom:6px;width:2px;background:var(--great);transform:translateX(-1px)}
.meter .needle{position:absolute;top:0;bottom:0;width:6px;border-radius:3px;background:var(--accent);left:50%;transform:translateX(-3px);transition:left .08s linear}
.strs{display:flex;justify-content:center;gap:6px}
.strs span{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid var(--line);font-size:.9375rem}
.strs span.on{color:#12141C}
.beatdots{display:flex;justify-content:center;gap:12px;margin:16px 0}
.beatdots i{width:22px;height:22px;border-radius:50%;background:var(--surface2)}
.beatdots i.on{background:var(--accent)}
.beatdots i.on.acc{background:var(--perfect)}
.bpm{font-size:3.5rem;font-weight:900;text-align:center;line-height:1}
/* settings */
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;border-top:1px solid var(--line);padding:6px 0}
.set:first-child{border-top:0}
.set select{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;max-width:58%}
.switch{position:relative;width:52px;height:32px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:16px;background:var(--surface2);border:1px solid var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:var(--text);top:3px;left:3px;transition:transform .15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(20px);background:#1A1C24}
.switch input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
/* onboarding */
.ob{min-height:calc(100vh - 40px);display:flex;flex-direction:column;gap:16px;padding-top:8px}
.ob .grow{flex:1}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--surface2)}
.steps i.on{background:var(--accent)}
.calib-dots{display:flex;gap:8px;justify-content:center;margin:20px 0}
.calib-dots i{width:24px;height:24px;border-radius:50%;background:var(--surface2);border:2px solid var(--line)}
.calib-dots i.tick{border-color:var(--accent)}
.calib-dots i.hit{background:var(--great);border-color:var(--great)}
.calib-dots i.missd{background:var(--miss);border-color:var(--miss)}
.level{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.level i{display:block;height:100%;background:var(--great);width:0}
.tapzone{min-height:140px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;font-weight:700;cursor:pointer;user-select:none;touch-action:manipulation;background:var(--surface)}
/* play */
#play{position:fixed;inset:0;z-index:50;background:#12141C;color:#F2F2F5;display:none;touch-action:none;user-select:none;-webkit-user-select:none}
#play.on{display:block}
#play canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 12px) 0 calc(env(safe-area-inset-left,0px) + 12px);display:flex;align-items:flex-start;gap:12px;pointer-events:none}
.hud .stat{display:flex;flex-direction:column;line-height:1.15;min-width:64px}
.hud .stat b{font-size:1.25rem;font-weight:900}
.hud .stat small{font-size:.6875rem;color:#A0A4B8}
.hud .next{flex:1;display:flex;justify-content:center;align-items:center;gap:10px}
.hud .next .cn{font-size:2rem;font-weight:900;line-height:1}
.hud .next .lab{font-size:.75rem;color:#A0A4B8;text-align:right;line-height:1.2}
.hud .next svg{--surface:#1E2130;--text:#F2F2F5;--sub:#A0A4B8;--line:rgba(242,242,245,.2)}
.hud .pause{pointer-events:auto;width:48px;height:48px;border-radius:14px;border:0;background:rgba(255,255,255,.08);color:#F2F2F5;display:grid;place-items:center;cursor:pointer}
.hud .pause svg{width:24px;height:24px}
.hud.lefty{flex-direction:row-reverse}
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(18,20,28,.72);z-index:3}
.overlay.on{display:flex}
.panel{background:#1E2130;border-radius:12px;padding:20px;max-width:420px;width:100%;color:#F2F2F5;text-align:center;border:1px solid rgba(242,242,245,.12)}
.panel h2{font-size:1.375rem}
.panel p{color:#A0A4B8}
.panel .btn{background:#282C3E;color:#F2F2F5;border-color:rgba(242,242,245,.12)}
.panel .btn.primary{background:#FFB020;color:#1A1C24}
.panel .level{background:#282C3E}
.rotate-hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transform:translateX(-50%);font-size:.75rem;color:#A0A4B8;pointer-events:none;white-space:nowrap}
/* modal & toast */
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,11,16,.6);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 20px)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:90;font-weight:500;max-width:90vw;display:none}
.toast.on{display:block}
textarea{width:100%;min-height:120px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px;font:inherit;color:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:root.calm *{transition:none!important;animation:none!important}
</style>
</head>
<body>
<div id="app"><main id="view" tabindex="-1"></main></div>
<nav class="tabs" id="tabs" aria-label="メイン"><div class="in" id="tabsIn"></div></nav>
<div id="play" aria-label="プレイ画面">
  <canvas id="cv"></canvas>
  <div class="hud" id="hud">
    <div class="stat"><b class="num" id="hScore">0</b><small>スコア</small></div>
    <div class="stat"><b class="num" id="hCombo">0</b><small>コンボ</small></div>
    <div class="stat"><b class="num" id="hAcc">–</b><small>正確さ</small></div>
    <div class="next" id="hNext"></div>
    <button class="pause" id="hPause" aria-label="一時停止"></button>
  </div>
  <div class="rotate-hint" id="rotHint">横向きにすると見やすくなります</div>
  <div class="overlay" id="pOverlay"><div class="panel" id="pPanel"></div></div>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ========== utilities ========== */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const rid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const clone=o=>JSON.parse(JSON.stringify(o));
function hashStr(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function prng(seed){let a=seed||1;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function deepMerge(base,over){const out=clone(base);if(!over||typeof over!=='object')return out;for(const k of Object.keys(over)){if(over[k]&&typeof over[k]==='object'&&!Array.isArray(over[k])&&out[k]&&typeof out[k]==='object'&&!Array.isArray(out[k]))out[k]=deepMerge(out[k],over[k]);else out[k]=over[k];}return out;}

/* ========== 配信設定（「4. ゲームデザイン」のパラメータ表と同じキー） ========== */
const DEFAULT_CONFIG={
  judge:{perfect_ms:30,great_ms:60,good_ms:100},
  score:{perfect:100,great:70,good:40,miss:0},
  combo:{step_notes:10,step_rate:0.1,max_mult:2.0},
  stars:{one:70,two:85,three:95},
  unlock:{stars_to_next:1,boss_stars_to_next_world:2},
  xp:{per_minute:10,first_star_bonus:[20,40,60],quest:30,quest_all_bonus:50,weak_card_cleared:20},
  level:{base:100,step:40,max:100},
  difficulty:{window:5,up_at:95,up_rate:5,down_at:70,down_rate:10,min_speed:50},
  weak:{register_below:60,intervals_days:[1,3,7],graduate_passes:3,graduate_accuracy:85,max_cards:10},
  quest:{count:3,reset_hour:4},
  rest:{recommend_minutes_first:15,first_days:14,recommend_minutes:30},
  league:{group_size:30,promote:7,demote:5,tiers:7},
  calib:{clicks:8,interval_ms:500,max_std_ms:15,bt_perfect_std_ms:20},
  detect:{onset_db_above_ambient:12,yin_threshold:0.15,pitch_cents:50,chord_match:0.8}
};
let CONFIG=deepMerge(DEFAULT_CONFIG,LS.get('fq.config',null));

function dayKey(t=Date.now()){const d=new Date(t-CONFIG.quest.reset_hour*3600e3);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(key,n){const[y,m,d]=key.split('-').map(Number);return dayKey(new Date(y,m-1,d+n,12).getTime());}
function daysBetween(a,b){const[y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number);return Math.round((new Date(y2,m2-1,d2,12)-new Date(y1,m1-1,d1,12))/864e5);}
function weekStart(t=Date.now()){const[y,m,d]=dayKey(t).split('-').map(Number);const dt=new Date(y,m-1,d,12);const dow=(dt.getDay()+6)%7;return new Date(y,m-1,d-dow,CONFIG.quest.reset_hour).getTime();}
function weekKey(t=Date.now()){return 'W'+dayKey(weekStart(t)+12*3600e3);}
function fmtDay(key){const[y,m,d]=key.split('-').map(Number);const w='日月火水木金土'[new Date(y,m-1,d).getDay()];return `${m}/${d}（${w}）`;}

const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const OPEN=[null,64,59,55,50,45,40]; // 1弦〜6弦の開放（MIDI）

const SHAPES={ // [1弦..6弦]、-1は鳴らさない弦
  'Em':[0,0,0,2,2,0],'Am':[0,1,2,2,0,-1],'C':[0,1,0,2,3,-1],'G':[3,0,0,0,2,3],'D':[2,3,2,0,-1,-1],
  'E':[0,0,1,2,2,0],'A':[0,2,2,2,0,-1],'Dm':[1,3,2,0,-1,-1],'F(簡易)':[1,1,2,3,-1,-1],'F':[1,1,2,3,3,1],
  'Bm':[2,3,4,4,2,-1],'A7':[0,2,0,2,0,-1],'D7':[2,1,2,0,-1,-1],'E7':[0,0,1,0,2,0]
};
const _ci={};
function chordInfo(name){
  if(_ci[name])return _ci[name];
  const sh=SHAPES[name];const strings=[],mute=[],midis=[];
  for(let s=1;s<=6;s++){const f=sh[s-1];if(f<0)mute.push(s);else{strings.push(s);midis.push(OPEN[s]+f);}}
  return _ci[name]={strings,mute,midis,pcs:[...new Set(midis.map(m=>m%12))]};
}
function rootMidi(name){if(!name)return null;const m=name.match(/^[A-G]#?/);if(!m)return null;const pc=NOTE_NAMES.indexOf(m[0]);return 36+((pc-4+12)%12)+4;} // E2(40)〜D#3
function midiName(m){return NOTE_NAMES[((m%12)+12)%12];}

/* ========== 譜面の生成（「6. サウンド・譜面」3章の形式） ========== */
function barEvents(def,b,rnd,st){
  const ev=[];let chord=null;
  const bassAt=()=>{const arr=def.bass||['Em'];return arr[Math.floor(b/(def.per||1))%arr.length];};
  const chordEvents=(ch)=>{for(const[bt,d]of def.pat){if(d==='gd'||d==='gu')ev.push({beat:bt,ghost:true,dir:d==='gd'?'down':'up'});else if(d==='x')ev.push({beat:bt,type:'mute',chord:ch,strum:'down'});else ev.push({beat:bt,type:'chord',chord:ch,strum:d==='u'?'up':'down'});}};
  const singleEvents=()=>{for(const bt of def.beats){let i;do{i=Math.floor(rnd()*def.pool.length);}while(def.pool.length>1&&i===st.last);st.last=i;const[s,f]=def.pool[i];ev.push({beat:bt,type:'single',string:s,fret:f});}};
  switch(def.kind){
    case 'single':chord=bassAt();singleEvents();break;
    case 'chord':chord=def.prog[Math.floor(b/def.per)%def.prog.length];chordEvents(chord);break;
    case 'mix':chord=def.prog[Math.floor(b/def.per)%def.prog.length];if(b%2===0)chordEvents(chord);else singleEvents();break;

    const src=c.createMediaStreamSource(this.stream);const node=c.createScriptProcessor(512,1,1);const z=c.createGain();z.gain.value=0;
    src.connect(node);node.connect(z);z.connect(c.destination);node.onaudioprocess=e=>this.process(e.inputBuffer.getChannelData(0));
    this.node=node;this._src=src;this.ok=true;this.error=null;this.hint='';this.reason=null;
    this.stream.getAudioTracks().forEach(t=>t.addEventListener('ended',()=>{this.ok=false;try{node.disconnect();src.disconnect();}catch(e){}}));
    return true;
  },
  process(buf){
    const n=buf.length,r=this.ring,m=this.mask;for(let i=0;i<n;i++)r[(this.pos+i)&m]=buf[i];this.pos+=n;
    if(performance.now()-this.t0<4000){const a=A.ctx.currentTime-this.pos/this.sr;if(a<this.anchor)this.anchor=a;}
    const active=this.listeners.size>0;
    while(this.nextHop+1024<=this.pos){const s=this.nextHop;
      if(active||this.meter){for(let i=0;i<1024;i++)this.frame[i]=r[(s+i)&m];const idx=s+1024-128;const on=this.det.step(this.frame,idx);

        if(on&&active){const ev={idx,time:this.timeOf(idx),db:this.det.db};for(const fn of this.listeners)fn(ev);}}

  },
  timeOf(idx){return this.anchor+idx/this.sr;},
  request(start,len,cb){this.reqs.push({start,len,cb});},
  latest(n){const out=new Float32Array(n);const s=this.pos-n;for(let i=0;i<n;i++)out[i]=this.ring[(s+i)&this.mask];return out;},
  /* 環境音を測る（ms） */
  measureAmbient(ms){return new Promise(res=>{this.meter=true;this.measure={sum:0,n:0};setTimeout(()=>{const m=this.measure;this.measure=null;this.meter=false;const db=m&&m.n?m.sum/m.n:-60;this.det.ambientDb=Math.max(-90,Math.min(-25,db));res(this.det.ambientDb);},ms);});},
  level(){return this.det?this.det.db:-100;},
  setGate(v){if(this.det)this.det.gateDb=v;},
  /* 音の判定：単音はYIN、和音はクロマ */
  checkNote(ev,note,cb){
    const sr=this.sr;
    if(note.type==='single'){this.request(ev.idx+Math.round(0.035*sr),2048,seg=>{const r=yin(seg,sr,CONFIG.detect.yin_threshold);const ok=(r.freq>0&&note.alts.some(mm=>pcDistanceCents(r.freq,mm)<=CONFIG.detect.pitch_cents))||yinHasPitch(seg,sr,note.alts,0.5,CONFIG.detect.pitch_cents);cb(ok,r.freq?midiName(Math.round(69+12*Math.log2(r.freq/440))):'?');});}
    else if(note.type==='chord'){this.request(ev.idx+Math.round(0.05*sr),Math.round(0.17*sr),seg=>{const ch=chromaOf(seg,sr,this.fft8k);cb(chordMatch(ch,note.pcs)>=CONFIG.detect.chord_match,'');});}

  }
};

const STORE_KEY='fq.progress.v1';

function mergeProgress(a,b){
  if(!b)return a;const m=deepMerge(blankProgress(),a);
  if(b.profile&&(!a.profile||(b.profile.updatedAt||0)>(a.profile.updatedAt||0)))m.profile=b.profile;
  for(const k in b.stars||{})m.stars[k]=Math.max(m.stars[k]||0,b.stars[k]);
  for(const k in b.best||{})m.best[k]=Math.max(m.best[k]||0,b.best[k]);
  const ids=new Set(m.xpEvents.map(e=>e.i));for(const e of b.xpEvents||[])if(!ids.has(e.i)){m.xpEvents.push(e);ids.add(e.i);}
  m.xpEvents.sort((x,y)=>x.t-y.t);
  for(const k in b.weakDone||{})m.weakDone[k]=Math.max(m.weakDone[k]||0,b.weakDone[k]);
  const wm=new Map(m.weak.map(w=>[w.id,w]));for(const w of b.weak||[]){const x=wm.get(w.id);if(!x||(w.updatedAt||0)>(x.updatedAt||0))wm.set(w.id,w);}
  m.weak=[...wm.values()].filter(w=>!m.weakDone[w.id]);
  if(b.quests){if(!m.quests||b.quests.day>m.quests.day)m.quests=b.quests;else if(b.quests.day===m.quests.day){m.quests.list.forEach((q,i)=>{const o=b.quests.list[i];if(o&&o.kind===q.kind&&o.ref===q.ref&&o.done)q.done=true;});m.quests.allBonus=m.quests.allBonus||b.quests.allBonus;}}
  const hm=new Map(m.history.map(h=>[h.id,h]));for(const h of b.history||[])hm.set(h.id,h);m.history=[...hm.values()].sort((x,y)=>x.t-y.t).slice(-100);
  for(const k in b.playLog||{})m.playLog[k]=Math.max(m.playLog[k]||0,b.playLog[k]);
  if((b.updatedAt||0)>(a.updatedAt||0)){m.recent=b.recent||{};m.speed=b.speed||{};}
  for(const k in b.drillHist||{})m.drillHist[k]=b.drillHist[k];
  m.maxCombo=Math.max(m.maxCombo||0,b.maxCombo||0);m.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);
  return m;
}

const Sync={ref:null,timer:null,busy:false,dirty:false,status:'local',
  async init(){
    if(!Cap.db||!Cap.uid)return;
    try{this.ref=Cap.db.doc('data/users/'+Cap.uid+'/progress');const snap=await this.ref.get();

  },
  schedule(delay=2000){if(!this.ref)return;this.dirty=true;clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),delay);},
  async flush(){if(!this.ref)return;if(this.busy){this.schedule(1500);return;}this.busy=true;this.dirty=false;
    try{await this.ref.set({p:clone(P),at:Date.now()});this.status='synced';}
    catch(e){this.status='pending';if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')){this.ref=null;this.status='local';}else setTimeout(()=>this.schedule(0),30000);}
    finally{this.busy=false;if(this.dirty)this.schedule();}}
};

/* ========== XP・レベル ========== */
function addXP(a,src){if(a>0)P.xpEvents.push({i:rid(),a:Math.round(a),t:Date.now(),s:src});}
function totalXP(){let s=0;for(const e of P.xpEvents)s+=e.a;return s;}
function weekXP(){const ws=weekStart();let s=0;for(const e of P.xpEvents)if(e.t>=ws)s+=e.a;return s;}
function levelInfo(xp=totalXP()){const L=CONFIG.level;let lv=1,need=L.base,rem=xp;while(lv<L.max&&rem>=need){rem-=need;lv++;need=L.base+L.step*(lv-1);}return{lv,cur:rem,need:lv>=L.max?0:need};}
function starsFor(acc){const s=CONFIG.stars;return acc>=s.three?3:acc>=s.two?2:acc>=s.one?1:0;}
function starStr(n,max=3){return `<span aria-label="★${n}つ（${max}つ中）"><span class="star-on" aria-hidden="true">${'★'.repeat(n)}</span><span class="star-off" aria-hidden="true">${'☆'.repeat(max-n)}</span></span>`;}

/* ========== 解放 ========== */
function worldUnlocked(w){if(w<=1)return true;const prevBoss=WORLDS[w-2].list[11].id;return(P.stars[prevBoss]||0)>=CONFIG.unlock.boss_stars_to_next_world;}
function stageUnlocked(st){if(!worldUnlocked(st.world))return false;if(st.no===1)return true;const prev=WORLDS[st.world-1].list[st.no-2];return(P.stars[prev.id]||0)>=CONFIG.unlock.stars_to_next;}
function currentWorld(){let w=1;for(let i=1;i<=WORLDS.length;i++)if(worldUnlocked(i))w=i;return w;}
function nextStage(){const w=WORLDS[currentWorld()-1];return w.list.find(s=>stageUnlocked(s)&&!(P.stars[s.id]>0))||w.list.filter(stageUnlocked).sort((a,b)=>(P.stars[a.id]||0)-(P.stars[b.id]||0))[0];}

/* ========== 練習時間・連続日数・休憩 ========== */
function addPlay(sec){const k=dayKey();P.playLog[k]=(P.playLog[k]||0)+sec;}
function streak(){let k=dayKey(),n=0;if(!(P.playLog[k]>0))k=addDays(k,-1);while(P.playLog[k]>0){n++;k=addDays(k,-1);}return n;}
function restLimitMin(){const r=CONFIG.rest;const created=P.profile&&P.profile.createdAt?dayKey(P.profile.createdAt):dayKey();return daysBetween(created,dayKey())<r.first_days?r.recommend_minutes_first:r.recommend_minutes;}
function todayMin(){return Math.floor((P.playLog[dayKey()]||0)/60);}
function needRest(){return todayMin()>=restLimitMin();}

/* ========== 苦手カード ========== */
function weakDue(w){return w.due<=dayKey();}
function registerWeak(stageId,bar,speed){
  const W=CONFIG.weak,now=Date.now();const ex=P.weak.find(w=>w.stageId===stageId&&w.bar===bar);
  if(ex){ex.due=addDays(dayKey(),W.intervals_days[0]);ex.passes=0;ex.speed=speed;ex.updatedAt=now;return'update';}
  if(P.weak.length>=W.max_cards)return'full';
  P.weak.push({id:rid(),stageId,bar,speed,createdAt:now,due:addDays(dayKey(),W.intervals_days[0]),passes:0,updatedAt:now});return'new';
}
function weakLabel(w){const st=STAGES[w.stageId];return st?`${st.world}-${st.no}「${st.t}」${w.bar}小節目`:'';}

/* ========== デイリークエスト（「4. ゲームデザイン」4章） ========== */
function ensureQuests(){
  const today=dayKey();if(P.quests&&P.quests.day===today)return P.quests;
  const s=Settings.get(),cw=currentWorld(),list=[];
  const recentDrills=new Set(Object.entries(P.drillHist).filter(([,d])=>daysBetween(d,today)<7).map(([k])=>k));
  const pickDrill=(pred)=>{const all=Object.values(DRILLS).filter(d=>d.minWorld<=cw&&pred(d)&&!list.some(q=>q.ref===d.id));const fresh=all.filter(d=>!recentDrills.has(d.id));const pool=fresh.length?fresh:all;return pool[Math.floor(prng(hashStr(today+list.length))()*pool.length)];};
  if(s.light){for(let i=0;i<CONFIG.quest.count;i++){const d=pickDrill(x=>x.light);if(d){list.push({kind:'drill',ref:d.id,label:d.t,done:false});P.drillHist[d.id]=today;}}}
  else{
    const due=P.weak.filter(weakDue).sort((a,b)=>a.due<b.due?-1:1)[0];
    const ns=nextStage();
    if(due)list.push({kind:'weak',ref:due.id,label:'苦手カード：'+weakLabel(due),done:false});
    else{const cand=WORLDS[cw-1].list.filter(x=>stageUnlocked(x)&&(P.stars[x.id]||0)>0&&(P.stars[x.id]||0)<3).sort((a,b)=>(P.stars[a.id]||0)-(P.stars[b.id]||0));
      const st=cand[0];if(st)list.push({kind:'stage',ref:st.id,label:`★を増やす：${st.world}-${st.no}「${st.t}」`,done:false});
      else{const d=pickDrill(()=>true);list.push({kind:'drill',ref:d.id,label:d.t,done:false});P.drillHist[d.id]=today;}}
    if(ns&&!(P.stars[ns.id]>0))list.push({kind:'clear',ref:ns.id,label:`クリアする：${ns.world}-${ns.no}「${ns.t}」`,done:false});
    else{const d=pickDrill(()=>true);list.push({kind:'drill',ref:d.id,label:d.t,done:false});P.drillHist[d.id]=today;}
    const d=pickDrill(()=>true);if(d){list.push({kind:'drill',ref:d.id,label:d.t,done:false});P.drillHist[d.id]=today;}
  }
  P.quests={day:today,list:list.slice(0,CONFIG.quest.count),allBonus:false};save();return P.quests;
}
function questProgress(meta,stars){
  const q=ensureQuests(),done=[];
  for(const x of q.list){if(x.done)continue;
    if((x.kind==='weak'&&meta.mode==='weak'&&meta.cardId===x.ref)||(x.kind==='stage'&&meta.mode==='stage'&&meta.stageId===x.ref)||(x.kind==='clear'&&meta.mode==='stage'&&meta.stageId===x.ref&&stars>=1)||(x.kind==='drill'&&meta.mode==='drill'&&meta.drillId===x.ref)){
      x.done=true;addXP(CONFIG.xp.quest,'quest');done.push({label:x.label,xp:CONFIG.xp.quest});}}
  if(!q.allBonus&&q.list.length&&q.list.every(x=>x.done)){q.allBonus=true;addXP(CONFIG.xp.quest_all_bonus,'quest_all');done.push({label:'3つすべて達成',xp:CONFIG.xp.quest_all_bonus});}
  return done;
}

/* ========== 速度の自動調整 ========== */
function updateSpeed(id,acc,used){
  const d=CONFIG.difficulty;const r=(P.recent[id]=[...(P.recent[id]||[]),acc].slice(-d.window));let sp=used,msg='';
  if(acc<d.down_at&&used>d.min_speed){sp=Math.max(d.min_speed,used-d.down_rate);P.recent[id]=[];msg=`次は速度${sp}%がおすすめです`;}
  else if(r.length>=d.window&&r.every(a=>a>d.up_at)&&used<100){sp=Math.min(100,used+d.up_rate);P.recent[id]=[];msg=`安定しています。次は速度${sp}%に上げます`;}
  P.speed[id]=sp;return msg;
}

/* ========== バッジ ========== */

  async load(){

  },

/* ========== 結果の反映（★・XP・苦手を保存） ========== */
function applyResult(pl){
  const ch=pl.chart,meta=pl.meta,cfg=pl.cfg,N=ch.notes.length||1;
  const acc=pl.sumBase/(100*N)*100,stars=starsFor(acc);
  const hits=pl.offsets,avg=hits.length?hits.reduce((a,b)=>a+b,0)/hits.length:0;
  const sec=Math.round(pl.playMs/1000);const before=levelInfo();const xp=[];
  const playXP=Math.round(sec/60*cfg.xp.per_minute);if(playXP>0){addXP(playXP,'play');xp.push({label:sec<60?`練習 ${sec}秒`:`練習 ${Math.floor(sec/60)}分${sec%60?sec%60+'秒':''}`,xp:playXP});}
  const res={meta,acc,stars,score:Math.round(pl.score),counts:{...pl.counts},avg,offsets:hits.slice(),maxCombo:pl.maxCombo,wrong:pl.wrong,sec,speed:ch.speed,xp,weakBars:[],msgs:[]};
  // 小節ごとの正確さ
  const byBar={};for(const n of ch.notes){const b=byBar[n.bar]||(byBar[n.bar]={sum:0,n:0});b.sum+=cfg.score[n.judged||'miss'];b.n++;}
  res.bars=Object.entries(byBar).map(([b,v])=>({bar:+b,acc:v.sum/(100*v.n)*100}));
  if(meta.mode==='stage'){
    const id=meta.stageId,prev=P.stars[id]||0;res.prevStars=prev;res.prevBest=P.best[id]||0;
    if(stars>prev){for(let k=prev+1;k<=stars;k++){const b=cfg.xp.first_star_bonus[k-1];addXP(b,'star');xp.push({label:`はじめての★${k}`,xp:b});}P.stars[id]=stars;}
    if(res.score>(P.best[id]||0))P.best[id]=res.score;
    for(const b of res.bars)if(b.acc<cfg.weak.register_below){const r=registerWeak(id,b.bar,ch.speed);if(r!=='full')res.weakBars.push(b.bar);else res.weakFull=true;}
    const m=updateSpeed(id,acc,ch.speed);if(m)res.msgs.push(m);
    const st=STAGES[id];res.unlockedNext=stars>=1&&prev<1&&st.no<12;res.worldUnlocked=st.boss&&stars>=cfg.unlock.boss_stars_to_next_world&&prev<cfg.unlock.boss_stars_to_next_world&&st.world<WORLDS.length;
  }else if(meta.mode==='weak'){
    const card=P.weak.find(w=>w.id===meta.cardId);
    if(card){const W=cfg.weak;if(weakDue(card)){if(acc>=W.graduate_accuracy){card.passes++;if(card.passes>=W.graduate_passes){P.weak=P.weak.filter(w=>w.id!==card.id);P.weakDone[card.id]=Date.now();addXP(cfg.xp.weak_card_cleared,'weak');xp.push({label:'苦手カード卒業',xp:cfg.xp.weak_card_cleared});res.graduated=true;}
          else{card.due=addDays(dayKey(),W.intervals_days[Math.min(card.passes,W.intervals_days.length-1)]);res.msgs.push(`合格です（${card.passes}/${W.graduate_passes}）。次の出題は${fmtDay(card.due)}です`);}}
        else{card.passes=0;card.due=addDays(dayKey(),W.intervals_days[0]);res.msgs.push(`正確さ${W.graduate_accuracy}%で合格です。明日もう一度出題します`);}card.updatedAt=Date.now();}
      else res.msgs.push(`出題日（${fmtDay(card.due)}）になると合格が記録されます`);}
  }
  xp.push(...questProgress(meta,stars));
  P.maxCombo=Math.max(P.maxCombo||0,pl.maxCombo);addPlay(sec);
  P.history.push({id:rid(),t:Date.now(),mode:meta.mode,ref:meta.stageId||meta.drillId||meta.cardId,acc:Math.round(acc*10)/10,score:res.score,sec,speed:ch.speed});P.history=P.history.slice(-100);
  const log=LS.get('fq.judgelog',{});const k=dayKey();log[k]=[...(log[k]||[]),...hits.map(Math.round)].slice(-600);for(const d of Object.keys(log))if(daysBetween(d,k)>30)delete log[d];LS.set('fq.judgelog',log);
  save();const after=levelInfo();res.levelUp=after.lv>before.lv?after.lv:0;res.xpTotal=xp.reduce((a,b)=>a+b.xp,0);
  League.push();return res;
}

/* ========== 遅延キャリブレーション（S04） ========== */
const Calib={phase:'idle',hits:[],clicks:[],result:null,err:null,timer:null,
  async run(){
    this.stop();this.err=null;this.result=null;this.hits=[];await A.resume();const s=Settings.get();
    if(s.input==='mic'){const ok=await Mic.start();if(!ok){this.err=(Mic.error||'マイクを使えません')+'。設定で「タップ」に切り替えると、マイクなしで遊べます。';this.phase='idle';render();return;}
      this.phase='measuring';render();await Mic.measureAmbient(1200);Mic.listeners.add(this._on||(this._on=ev=>{if(this.phase==='running')this.hits.push(ev.time);}));}
    const C=CONFIG.calib,c=A.ctx,T0=c.currentTime+1.0;this.clicks=[];for(let i=0;i<C.clicks;i++){const t=T0+i*C.interval_ms/1000;this.clicks.push(t);A.click(t,false);}
    this.phase='running';render();

  },
  tap(e){if(this.phase==='running'&&Settings.get().input==='tap')this.hits.push(A.eventCtxTime(e));},
  paint(){const dots=document.querySelectorAll('.calib-dots i');const now=A.ctx.currentTime;this.clicks.forEach((t,i)=>{const d=dots[i];if(!d)return;if(now>=t)d.classList.add('tick');if(this.match(t)!=null)d.classList.add('hit');});const lv=$('#calLvl');if(lv)lv.style.width=clamp((Mic.level()+70)/60*100,0,100)+'%';},
  match(t){let best=null,bd=1e9;for(const h of this.hits){const d=h-t;if(d>-0.2&&d<0.45&&Math.abs(d-0.05)<bd){bd=Math.abs(d-0.05);best=d;}}return best;},
  finish(){
    clearInterval(this.timer);if(this._on)Mic.listeners.delete(this._on);
    const diffs=this.clicks.map(t=>this.match(t)).filter(d=>d!=null).map(d=>d*1000);
    if(diffs.length<this.clicks.length){this.phase='idle';this.err=`${this.clicks.length}回のうち${diffs.length}回しか${Settings.get().input==='mic'?'音を検出':'タップを記録'}できませんでした。もう一度クリックに合わせて${Settings.get().input==='mic'?'開放6弦を弾いて':'タップして'}ください。`;render();return;}
    const s=diffs.sort((a,b)=>a-b).slice(1,-1);const med=(s[2]+s[3])/2;const mean=s.reduce((a,b)=>a+b,0)/s.length;const std=Math.sqrt(s.reduce((a,b)=>a+(b-mean)**2,0)/s.length);
    this.result={offset:Math.round(med),std:Math.round(std*10)/10,at:Date.now()};this.phase='done';render();
  },
  accept(){if(this.result)saveCalib(this.result);this.phase='idle';},
  stop(){clearInterval(this.timer);if(this._on)Mic.listeners.delete(this._on);this.phase='idle';}
};

function chordSVG(name,size=88,lefty=false){
  const sh=SHAPES[name];if(!sh)return'';const fr=sh.filter(f=>f>0);const maxF=fr.length?Math.max(...fr):1,minF=fr.length?Math.min(...fr):1;const base=maxF<=4?1:minF;
  const w=size,h=Math.round(size*1.2),px=w*0.17,top=h*0.2,gw=w-px*2,gh=h-top-h*0.05;const xs=s=>px+gw*(lefty?(s-1):(6-s))/5;
  let o=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(name)}の押さえ方">`;

  for(let s=1;s<=6;s++){o+=`<line x1="${xs(s)}" x2="${xs(s)}" y1="${top}" y2="${top+gh}" stroke="var(--sub)" stroke-width="1"/>`;const f=sh[s-1];
    if(f<0)o+=`<text x="${xs(s)}" y="${top-4}" text-anchor="middle" font-size="${Math.round(w*0.13)}" fill="var(--sub)">×</text>`;

    else o+=`<circle cx="${xs(s)}" cy="${top+gh*((f-base)+0.5)/4}" r="${w*0.07}" fill="var(--s${s})"/>`;}

/* ---------- S13 ツール（チューナー・メトロノーム） ---------- */
const Metro={bpm:LS.get('fq.metro',{bpm:80}).bpm,beats:4,on:false,timer:null,next:0,beat:0,
  async start(){await A.resume();this.on=true;this.next=A.ctx.currentTime+0.1;this.beat=0;this.timer=setInterval(()=>this.tick(),25);this.tick();},
  tick(){const c=A.ctx;while(this.next<c.currentTime+0.12){const b=this.beat%this.beats,t=this.next;A.click(t,b===0);const d=(t-c.currentTime)*1000;setTimeout(()=>this.flash(b),Math.max(0,d));this.next+=60/this.bpm;this.beat++;}},
  flash(b){document.querySelectorAll('.beatdots i').forEach((el,i)=>{el.classList.toggle('on',i===b);});},
  stop(){this.on=false;clearInterval(this.timer);this.timer=null;},
  set(b){this.bpm=clamp(Math.round(b),40,200);LS.set('fq.metro',{bpm:this.bpm});const e=$('#mBpm');if(e)e.textContent=this.bpm;const r=$('#mRange');if(r&&+r.value!==this.bpm)r.value=this.bpm;}
};
const Tuner={timer:null,hist:[],
  bind(){if(route.tab!=='metro'&&Mic.ok&&!this.timer)this.run();},
  async begin(){const ok=await Mic.start();if(!ok){toast(Mic.error||'マイクを使えません');render();return;}render();},
  run(){this.timer=setInterval(()=>this.tick(),80);},
  tick(){if(route.name!=='tools'||route.tab==='metro'){this.stop();return;}const seg=Mic.latest(2048);let e=0;for(let i=1024;i<2048;i++)e+=seg[i]*seg[i];const db=10*Math.log10(e/1024+1e-12);
    const r=db>-55?yin(seg,Mic.sr,0.15):{freq:0};const el=$('#tNote');if(!el)return;
    if(r.freq<60||r.freq>1100){if(db<=-55){this.hist=[];}return;}
    const m=69+12*Math.log2(r.freq/440);this.hist.push(m);if(this.hist.length>5)this.hist.shift();const sm=[...this.hist].sort((a,b)=>a-b)[this.hist.length>>1];
    const near=Math.round(sm),cents=Math.round((sm-near)*100);el.textContent=midiName(near);$('#tCents').textContent=(cents>0?'+':'')+cents+' セント';$('#tFreq').textContent=r.freq.toFixed(1)+' Hz';
    $('#tNeedle').style.left=clamp(50+cents,0,100)+'%';$('#tNeedle').style.background=Math.abs(cents)<=5?'var(--great)':'var(--accent)';
    let bs=1,bd=99;for(let s=1;s<=6;s++){const d=Math.abs(sm-OPEN[s]);if(d<bd){bd=d;bs=s;}}
    document.querySelectorAll('.strs span').forEach(sp=>{const s=+sp.dataset.s;const on=s===bs&&bd<2.5;sp.classList.toggle('on',on);sp.style.background=on?`var(--s${s})`:'';});},
  stop(){clearInterval(this.timer);this.timer=null;}
};

    :`${ICON.mic}<h2>チューナーはマイクを使います</h2><p class="sub">${esc(Mic.error||'弦を1本ずつ鳴らすと、音の高さを表示します。')}</p><button class="btn primary block" data-act="tunerStart">マイクを使って始める</button>`}</div>`;

  const s=Settings.get(),c=getCalib(),pr=P.profile||{};
  return `${backBar('my','設定')}
  <div class="section">判定</div><div class="card">
    ${sel('route','音を聞く方法',Object.entries(ROUTES))}${sel('input','判定のしかた',[['mic','マイクで音を聞き取る'],['tap','画面をタップする']])}
    <div class="set"><div><div>遅延キャリブレーション</div><div class="small sub num">${c.assumed?'未測定（推定 '+c.offset+'ms）':c.offset+'ms・ばらつき'+c.std+'ms'}</div></div><button class="btn" data-act="go" data-to="calib">測り直す</button></div>
    ${sel('gate','発音を検出する大きさ',[[6,'小さな音も拾う（+6dB）'],[9,'やや敏感（+9dB）'],[12,'標準（+12dB）'],[15,'やや鈍い（+15dB）'],[18,'大きな音だけ（+18dB）']])}
    ${sw('click','プレイ中にクリックを鳴らす','拍がわかりやすくなります')}
    <div class="set"><label for="vol">伴奏の音量</label><input id="vol" type="range" min="0" max="1" step="0.05" value="${s.volume}" style="width:50%;accent-color:var(--accent)" data-act="setVol"></div></div>
  <div class="section">表示</div><div class="card">
    ${sel('theme','テーマ',[['system','端末に合わせる'],['dark','ダーク'],['light','ライト']])}${sel('hand','ピックを持つ手',[['right','右手'],['left','左手（弦とボタンの並びを反転）']])}
    ${sel('fs','文字の大きさ',[[1,'標準'],[1.15,'大きい'],[1.3,'とても大きい（130%）']])}${sw('calm','演出を減らす','判定の拡大や揺れをなくし、形と色だけで示します')}</div>
  <div class="section">練習</div><div class="card">${sw('light','軽いモード','デイリークエストを単音と開放弦のドリルにします（明日から反映）')}</div>
  <div class="section">プロフィール</div><div class="card"><div class="set"><span>年齢区分</span><span class="sub">${{child:'13歳未満',teen:'13〜17歳',adult:'18歳以上'}[pr.ageClass]||'未設定'}</span></div>
    <div class="set"><span>進捗の保存先</span><span class="sub">${Sync.status==='synced'?'アカウント':'この端末'}</span></div>
    <div class="set"><div><div>進捗を消す</div><div class="small sub">★、XP、苦手カードがすべて消えます</div></div><button class="btn" data-act="resetAsk">消す</button></div></div>`;
}
function vCalib(){return `${backBar('settings','遅延キャリブレーション')}<p class="sub">判定のずれが気になるとき、音を聞く方法を変えたときに測り直してください。値は端末と聞く方法ごとに保存します。</p>${calibBlock()}`;}

/* ========== 操作 ========== */
function playStage(id,speed){const st=STAGES[id];const sp=speed||P.speed[id]||100;const meta={mode:'stage',stageId:id,title:stageTitle(st),back:'map',rebuild:()=>buildChart(st,sp)};Play.start(meta.rebuild(),meta);}
function playDrill(id){const d=DRILLS[id];const bars=Math.ceil(60000/(240000/d.def.bpm));const meta={mode:'drill',drillId:id,title:d.t,back:'home',rebuild:()=>buildChart(d.def,100,{bars})};Play.start(meta.rebuild(),meta);}
function playWeak(id){const w=P.weak.find(x=>x.id===id);if(!w)return;const st=STAGES[w.stageId];const meta={mode:'weak',cardId:id,title:'苦手カード：'+weakLabel(w),back:'weak',rebuild:()=>buildBarChart(st,w.speed||100,w.bar)};Play.start(meta.rebuild(),meta);}
const ACT={
  go:d=>go(d.to,d.w?{w:+d.w}:{}),
  obSet:d=>{OB[d.k]=d.v;render();},
  obMic:async()=>{const ok=await Mic.start();if(ok){Settings.set('input','mic');go('ob4');}else render();},
  obTap:()=>{Settings.set('input','tap');go('ob4');},
  obFinish:()=>finishOnboarding(),
  setRoute:d=>{Settings.set('route',d.v);Calib.result=null;if(Calib.phase==='done')Calib.phase='idle';render();},
  calibRun:()=>Calib.run(),
  calibAccept:()=>{Calib.accept();toast('補正値を保存しました');if(/^ob/.test(route.name))finishOnboarding();else go('settings');},
  mapWorld:d=>go('map',{w:+d.w}),
  openStage:d=>{const st=STAGES[d.id];if(!worldUnlocked(st.world)){go('map',{w:st.world});return;}go('stage',{id:d.id});},
  guide:async d=>{if(Guide.on){Guide.stop();render();return;}const st=STAGES[d.id];const sp=+($('#speed')||{value:100}).value;await Guide.play(buildChart(st,sp),4);render();},
  playStage:d=>playStage(d.id,+($('#speed')||{value:0}).value),
  playWeak:d=>playWeak(d.id),
  questGo:d=>{const q=ensureQuests().list[+d.i];if(!q)return;if(q.kind==='drill')playDrill(q.ref);else if(q.kind==='weak')playWeak(q.ref);else go('stage',{id:q.ref});},
  pBegin:()=>Play.begin(),pQuit:()=>Play.quit(),pResume:()=>Play.resume(),pRetry:()=>Play.retry(),
  resRetry:()=>{const m=route.res.meta;Play.start(m.rebuild(),m);},
  report:()=>modal(`<h2>判定についての報告</h2><p class="sub small">どのように感じたか選んでください。音声は送りません。</p>${chipSet('reason',[['missed','弾いたのにMISSになった'],['ghost','弾いていないのに判定された'],['timing','タイミングがずれている'],['other','その他']],null,'repPick')}
    <textarea id="repTxt" style="margin-top:12px" placeholder="気づいたこと（任意）" aria-label="詳しい内容"></textarea><div class="stack" style="margin-top:12px"><button class="btn primary block" data-act="repSend">送る</button><button class="btn ghost block" data-act="closeModal">閉じる</button></div>`),
  repPick:(d,el)=>{document.querySelectorAll('#sheet .chip').forEach(c=>c.setAttribute('aria-pressed',c===el));$('#sheet').dataset.reason=d.v;},
  repSend:async()=>{const r=route.res;const item={t:Date.now(),reason:$('#sheet').dataset.reason||'other',text:($('#repTxt').value||'').slice(0,500),ref:r?r.meta.stageId||r.meta.drillId||r.meta.cardId:'',acc:r?Math.round(r.acc):null,route:Settings.get().route,input:Settings.get().input,offset:getCalib().offset};
    const list=[...LS.get('fq.reports',[]),item].slice(-20);LS.set('fq.reports',list);let sent=false;
    if(Cap.db&&Cap.uid){try{await Cap.db.doc('reports/'+Cap.uid).set({items:list});sent=true;}catch(e){}}
    closeModal();toast(sent?'報告を送りました。判定の改善に使います':'報告をこの端末に記録しました');},
  closeModal:()=>closeModal(),
  toolTab:d=>{Tuner.stop();route.tab=d.tab;render();},
  tunerStart:()=>Tuner.begin(),
  metroToggle:()=>{if(Metro.on)Metro.stop();else Metro.start();render();},
  metroStep:d=>Metro.set(Metro.bpm+(+d.d)),
  metroBeats:d=>{Metro.beats=+d.v;render();},
  leagueReload:()=>{League.rows=null;League.err=null;render();},
  share:async()=>{const li=levelInfo();let wk=0;for(let i=0;i<7;i++)wk+=(P.playLog[addDays(dayKey(),-i)]||0);
    const txt=`FretQuest の練習記録\n直近7日の練習：${Math.round(wk/60)}分\n連続日数：${streak()}日\nレベル：${li.lv}\n★の数：${Object.values(P.stars).reduce((a,b)=>a+b,0)}`;
    let ok=false;try{await navigator.clipboard.writeText(txt);ok=true;}catch(e){}
    modal(`<h2>練習記録の文章</h2><p class="sub small">${ok?'コピーしました。メッセージに貼り付けて送れます。':'下の文章を選択してコピーしてください。'}</p><textarea readonly>${esc(txt)}</textarea><button class="btn block" style="margin-top:12px" data-act="closeModal">閉じる</button>`);},
  resetAsk:()=>modal(`<h2>進捗を消しますか</h2><p class="sub">★、XP、苦手カード、練習記録がすべて消えます。元に戻せません。遅延の補正値と設定は残ります。</p><div class="stack"><button class="btn primary block" data-act="resetDo">消す</button><button class="btn ghost block" data-act="closeModal">やめる</button></div>`),
  resetDo:()=>{const prof=P.profile;P=blankProgress();P.profile=prof;save();closeModal();go('home');toast('進捗を消しました');}
};
function finishOnboarding(){
  Calib.stop();const y=+OB.by,m=+OB.bm,now=new Date();let age=now.getFullYear()-y-((now.getMonth()+1)<m?1:0);
  const ageClass=age<13?'child':age<18?'teen':'adult';
  P.profile={guitar:OB.guitar,hand:OB.hand,exp:OB.exp,birth:`${y}-${String(m).padStart(2,'0')}`,ageClass,onboarded:true,createdAt:Date.now(),updatedAt:Date.now()};
  Settings.set('hand',OB.hand||'right');save();go('home');
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.tagName==='SELECT'||el.type==='checkbox'||el.type==='range')return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el.dataset,el,e);}});
document.addEventListener('change',e=>{const el=e.target;const a=el.dataset&&el.dataset.act;if(!a)return;
  if(a==='obSel'){OB[el.dataset.k]=el.value;render();}
  if(a==='setSel'){const k=el.dataset.k;let v=el.value;if(k==='fs'||k==='gate')v=+v;Settings.set(k,v);if(k==='input'||k==='route')Calib.result=null;if(k==='light'){}render();}
  if(a==='setBool'){Settings.set(el.dataset.k,el.checked);}
  if(a==='setVol'){Settings.set('volume',+el.value);}});
document.addEventListener('pointerdown',e=>{if(e.target.closest('#tapzone'))Calib.tap(e);});

/* ========== 起動 ========== */
applySettings();render();
(async()=>{
  if(!window.claude||typeof window.claude.use!=='function')return;
  try{const[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);Cap.db=db;Cap.user=user;
    if(user){try{Cap.uid=await user.id();}catch(e){}}
    if(db){await loadRemoteConfig();await Sync.init();}
    if(route.name==='league')render();}catch(e){}
})();
/* ========== PWA：Service Worker の登録 ========== */
if('serviceWorker' in navigator&&window.isSecureContext&&window.self===window.top){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
</body>
